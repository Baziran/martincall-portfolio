[project]
name = "aef-python-terminal"
version = "1.5.0"
description = "Local modular MartinCall trading terminal for research, replay, alerts, and IBKR integration."
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.140.0",
  "starlette>=1.3.1",
  "uvicorn[standard]>=0.38.0",
  "numpy>=2.3.3",
  "pydantic>=2.12.0",
  "psycopg[binary]>=3.2.10",
  "psycopg-pool>=3.2.7",
  "ib_async>=2.1.0,<3",
  "t-tech-investments @ https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/files/018cd34007d9308d755ca583e502224a8009211d52f903bcbfa48853d47fa9de/t_tech_investments-1.49.3-py3-none-any.whl#sha256=018cd34007d9308d755ca583e502224a8009211d52f903bcbfa48853d47fa9de",
  "orjson>=3.11.1",
  "tzdata>=2025.2,<2026",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.11.8",
  "httpx>=0.28.1",
  "httpx2>=2.9.1",
  "playwright>=1.61.0",
]
ml = [
  "xgboost>=3.3.0,<4; platform_system == 'Darwin'",
  "xgboost-cpu>=3.3.0,<4; platform_system != 'Darwin'",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"aef_terminal.indicators.modules.martin_carlo" = ["models/*.json"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint.per-file-ignores]
# Standalone tools bootstrap the repository path before importing the package.
"scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]
