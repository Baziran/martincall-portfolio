name: API Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  smoke-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dev dependencies
        run: |
          pip install --requirement requirements.lock
          pip install -e ".[dev]"
      - name: Run in-process API smoke tests
        run: PYTHONPATH=src python -m pytest tests/test_api_smoke.py -q
