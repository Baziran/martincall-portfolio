name: UI Architecture Gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-ui-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install dev dependencies
        run: |
          pip install --requirement requirements.lock
          pip install -e ".[dev]"
      - name: Run UI architecture gates
        run: PYTHON=python make test-ui-gates
